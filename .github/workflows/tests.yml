name: Tests

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-suite:
    name: test-suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          python -m pip install --no-deps -e .

      - name: Build and smoke-test wheel
        run: |
          python setup.py bdist_wheel --dist-dir "$RUNNER_TEMP/calvin-wheels"
          python -m venv "$RUNNER_TEMP/calvin-wheel-venv"
          "$RUNNER_TEMP/calvin-wheel-venv/bin/python" -m pip install --no-deps "$RUNNER_TEMP"/calvin-wheels/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/calvin-wheel-venv/bin/python" -c "from calvin_utils.resource_paths import resource_path; import calvin_utils.neuroimaging_utils; assert resource_path('MNI152_T1_2mm_brain_mask.nii').is_file()"

      - name: Run behavioral and module contracts
        env:
          MPLBACKEND: Agg
        run: python -m coverage run -m pytest -q

      - name: Enforce repository coverage floor
        run: python -m coverage report

      - name: Enforce core-pipeline coverage floor
        run: >-
          python -m coverage report
          --include=calvin_utils/file_utils/csv_prep.py,calvin_utils/file_utils/file_path_collector.py,calvin_utils/neuroimaging_utils/io/importers.py,calvin_utils/neuroimaging_utils/nifti_utils/volume_io.py,calvin_utils/neuroimaging_utils/tract_utils/fiber_io.py,calvin_utils/neuroimaging_utils/tract_utils/fiber_converter.py,calvin_utils/neuroimaging_utils/tract_utils/filter_fibers.py,calvin_utils/permutation_analysis_utils/map_damage_cv.py,calvin_utils/permutation_analysis_utils/voxelwise_regression.py,calvin_utils/permutation_analysis_utils/voxelwise_regression_prep.py,calvin_utils/permutation_analysis_utils/statsmodels_palm.py,calvin_utils/neuroimaging_utils/ccm_utils/symptom_specificity.py,calvin_utils/neuroimaging_utils/ccm_utils/sensitivity_map.py,calvin_utils/statistical_utils/data_transformation.py
          --fail-under=55

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-python-3.10
          path: .coverage
          if-no-files-found: ignore
          retention-days: 7
