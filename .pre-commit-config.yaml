repos:
  - repo: local
    hooks:
      - id: strip-notebook-outputs
        name: Strip Jupyter notebook outputs
        entry: python scripts/strip_notebook_outputs.py
        language: system
        types: [jupyter]
        pass_filenames: true
      - id: pytest-before-push
        name: Run test suite before push
        entry: python scripts/run_tests.py
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
